<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Guilherme Santos Computer Vision banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset=".6" stop-color="#0b1d2b"/>
      <stop offset="1" stop-color="#092732"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65f0d2"/>
      <stop offset="1" stop-color="#56b6f4"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6efbd8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6efbd8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6efbd8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop offset="0" stop-color="#2a9eb1" stop-opacity=".22"/>
      <stop offset=".68" stop-color="#28d9c2" stop-opacity=".065"/>
      <stop offset="1" stop-color="#27b7c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#57adc0" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r=".8" fill="#85eddf" opacity=".22" />
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="1200" height="390" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <rect width="1200" height="390" fill="none" stroke="#6cf3d2" stroke-opacity=".12" stroke-width="2"/>
    <path d="M690 -10L1200 100V390H690Z" fill="url(#dots)" opacity=".45"/>
    <path d="M675 0L820 390M850 0L995 390M1025 0L1170 390" fill="none" stroke="#6ef9d7" stroke-opacity=".055" stroke-width="2" />
    <rect x="42" y="38" width="10" height="10" rx="2" fill="#76f4d3"/>
    <text x="64" y="47" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" letter-spacing="2.2" fill="#95e8da">VISUAL INTELLIGENCE / ENGINEERING</text>
    <text x="42" y="135" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-weight="800" fill="#f4f9fc" letter-spacing="-2">GUILHERME</text>
    <text x="42" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="800" fill="#f4f9fc" letter-spacing="-2">SANTOS<tspan fill="#76f4d3">.</tspan></text>
    <rect x="42" y="222" width="69" height="4" rx="2" fill="#72f5d5" />
    <rect x="121" y="222" width="31" height="4" rx="2" fill="#36788b" />
    <text x="42" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#cbebed">Computer Vision  ·  Applied AI</text>
    <text x="42" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#cbebed">Machine Vision  ·  Software Engineering</text>
    <path d="M42 337H510" stroke="#75d3d4" stroke-opacity=".25"/>
    <text x="42" y="362" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13" fill="#91bdc6" letter-spacing="1.2">FROM PIXELS TO REAL-WORLD IMPACT</text>
    <circle cx="950" cy="196" r="183" fill="url(#lens)" />
    <circle cx="950" cy="196" r="154" fill="none" stroke="#63d5d8" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 9"/>
    <circle cx="950" cy="196" r="118" fill="none" stroke="#65dbe0" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="950" cy="196" r="83" fill="none" stroke="#65dbe0" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="950" cy="196" r="48" fill="#1d6b81" fill-opacity=".11" stroke="#65e9d8" stroke-opacity=".52" stroke-width="1"/>
    <circle cx="950" cy="196" r="13" fill="#84f8d5" opacity=".22" filter="url(#glow)"/>
    <circle cx="950" cy="196" r="4.3" fill="#89ffe1"/>
    <path d="M950 44V348M796 196H1104" stroke="#80d7dd" stroke-opacity=".26" stroke-width="1" stroke-dasharray="5 7"/>
    <path d="M803 137v-34h42M1097 137v-34h-42M803 256v34h42M1097 256v34h-42" fill="none" stroke="url(#frame)" stroke-width="3" stroke-linecap="round"/>
    <rect x="835" y="114" width="225" height="166" rx="4" fill="url(#scan)" stroke="#79e6d9" stroke-opacity=".52" stroke-width="1.5"/>
    <rect x="865" y="135" width="76" height="96" rx="1" fill="#78e7d9" fill-opacity=".035" stroke="#79ffda" stroke-width="2"/>
    <path d="M865 150h13M865 150v13M941 150h-13M941 150v13M865 216h13M865 216v-13M941 216h-13M941 216v-13" stroke="#b2fce8" stroke-width="2" fill="none"/>
    <rect x="969" y="152" width="58" height="70" rx="1" fill="#70c9ff" fill-opacity=".025" stroke="#67bfff" stroke-opacity=".76" stroke-width="1.5"/>
    <path d="M969 162h10M969 162v10M1027 162h-10M1027 162v10M969 212h10M969 212v-10M1027 212h-10M1027 212v-10" stroke="#8ed6ff" stroke-width="1.5" fill="none"/>
    <circle cx="794" cy="195" r="3" fill="#78fbe0"/>
    <circle cx="1106" cy="195" r="3" fill="#78fbe0"/>
    <path d="M794 195h-44M1106 195h41" stroke="#58cfca" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="750" y="184" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#74d8d1" text-anchor="middle">IN</text>
    <text x="1147" y="184" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#74d8d1" text-anchor="middle">OUT</text>
    <path d="M739 44h72M739 44v21M1160 326h-72M1160 326v-21" fill="none" stroke="#6edbdf" stroke-opacity=".33" stroke-width="1.5"/>
    <text x="762" y="354" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#76d9ce" letter-spacing="1.6">OBSERVE  /  ANALYZE  /  BUILD</text>
  </g>
